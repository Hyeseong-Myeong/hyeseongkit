# hyeseongkit — 패키지 정의 (설계서 §0-4, §14-2)
# lint 규칙은 이 파일 [tool.ruff] 한 곳에만 둔다 (C3) — pre-commit과 CI가 같은 설정을 읽는다.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyeseongkit"
version = "0.1.0"
description = "개인용 CLI/스킬 허브 — 첫 번째 스킬: 세션 영속화"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=2,<3",
]

[project.optional-dependencies]
# 허브(NAS 컨테이너) 전용 — CLI(pipx) 설치는 기본 의존성만 (D7, D18: 클라이언트는 DB·암호화 키를 모른다)
hub = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "cryptography>=42",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "cryptography>=42",
]

[project.scripts]
hk = "hyeseongkit.cli.main:main"
hyeseongkit = "hyeseongkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyeseongkit = ["templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
