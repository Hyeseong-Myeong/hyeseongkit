# 로컬 lint (C3) — 규칙은 pyproject.toml [tool.ruff] 한 곳에만. CI lint job과 동일 결과.
# 사용: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: python
        additional_dependencies: [ruff]
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: python
        additional_dependencies: [ruff]
        types_or: [python, pyi]
        require_serial: true
