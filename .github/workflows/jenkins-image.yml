name: Jenkins Image

# 배포 트리거용 Jenkins 이미지(공식 Jenkins + docker CLI + compose 플러그인) 발행.
# 본 파이프라인과 분리한 이유: 이 이미지는 거의 바뀌지 않는데 매 main push마다 빌드할 이유가 없다.
# NAS는 pull만 한다 (2코어 보호 — 설계서 §14-1).

on:
  push:
    branches: [main]
    paths:
      - "deploy/jenkins/Dockerfile"
      - ".github/workflows/jenkins-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        # ghcr 이미지명은 소문자만 허용 — repository_owner를 그대로 쓰면 실패한다
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build & push jenkins
        run: |
          IMG=ghcr.io/${{ steps.owner.outputs.lc }}/hyeseongkit-jenkins
          TAG=sha-$(git rev-parse --short HEAD)
          docker build -f deploy/jenkins/Dockerfile -t $IMG:$TAG -t $IMG:latest deploy/jenkins/
          docker push --all-tags $IMG
